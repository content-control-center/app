services:
  llama-embedserver:
    image: alephbetai/llama-embedserver:latest
    platform: linux/amd64
    ports:
      - "9003:8080"

  # MinIO is the S3-compatible backend used by post-attachment integration
  # tests (CON-73). The bucket itself is created on demand by the test
  # helper — keeping that out of the compose file means each test run
  # starts from a clean state without docker volume juggling.
  minio:
    image: minio/minio:latest
    ports:
      - "9100:9000"
    environment:
      MINIO_ROOT_USER: integration
      MINIO_ROOT_PASSWORD: integration-secret
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
