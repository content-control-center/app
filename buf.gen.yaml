# All four gRPC contracts (tenants.v1, secrets.v1, pdf.v1, video.v1) live in the
# shared buf.build/ogen-app/proto module (CON-220), not in this repo. `make
# proto` generates from a pinned version of that module. Managed mode keeps the
# go_package_prefix below, so the generated import paths
# (github.com/ogen-app/ogen/gen/...) are unchanged — ogen serves TenantAdmin +
# Secrets and consumes Pdf + Video from exactly the same packages as before.
version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/ogen-app/ogen/gen
plugins:
  - plugin: go
    out: gen
    opt: paths=source_relative
  - plugin: go-grpc
    out: gen
    opt: paths=source_relative
