# Live-reload config for the Harbor dev container (docker-compose.override.yml
# mounts this at /app/.air.docker.toml). Mirrors ../harbor/.air.toml but adds
# filesystem POLLING — Docker Desktop bind-mount FS events don't cross the Linux
# VM on macOS/Windows, so air must poll to notice host edits. Kept in THIS repo
# so harbor's own tree needs no docker-specific config; keep the [build] cmd /
# excludes in sync with ../harbor/.air.toml.
#
# root is absolute (/app, the bind-mounted harbor source) because this file is
# mounted OUTSIDE /app — Docker Desktop's virtiofs can't create a mountpoint for
# a file nested inside another bind mount — so relative resolution can't be
# assumed. The build cmd/bin/tmp_dir stay relative to /app (the WORKDIR).
root = "/app"
tmp_dir = "tmp"

[build]
  cmd      = "GOTOOLCHAIN=go1.26.1 go build -o ./tmp/server ./cmd/server"
  bin      = "./tmp/server"
  delay    = 500
  # Watch Go source and SQL migration files; skip the Next.js tree, the embedded
  # UI artifact, docs, and test files.
  include_ext   = ["go", "sql"]
  exclude_dir   = ["tmp", "ui", "src/ui/dist", "docs"]
  exclude_regex = ["_test\\.go$"]
  log           = "tmp/build-errors.log"
  stop_on_error = true
  send_interrupt = true
  kill_delay     = "1s"
  # Bind-mount FS events are unreliable across the Docker Desktop VM — poll.
  poll = true

[log]
  time = true

[color]
  watcher = "cyan"
  build   = "yellow"
  runner  = "green"

[screen]
  clear_on_rebuild = true
