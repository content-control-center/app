syntax = "proto3";

package tenants.v1;

import "google/protobuf/timestamp.proto";

// TenantAdminService is the internal, operator-facing surface Harbor uses to
// READ and MANAGE tenant classification — a required tier (1 per tenant) and
// optional groups (many-to-many) (CON-208). It shares the listener and the
// shared-bearer-token gate with SecretsService (src/grpcserver).
//
// Cross-tenant by design: tenants, tenant_tiers and tenant_groups are global
// tables, so no per-tenant scoping applies. Tier is required, so there is no
// "unassign": SetTenantTier assigns or reassigns; "remove from tier" is a
// reassignment to another tier (e.g. the delete-protected 'default').
service TenantAdminService {
  // --- reads ---
  rpc ListTiers(ListTiersRequest) returns (ListTiersResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  // GetTenant returns one tenant with its tier + groups. NotFound if the id is
  // unknown or the tenant is soft-deleted.
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  // ListTenants returns tenants (optionally filtered by tier and/or group),
  // each with tier + groups, plus the total match count for paging.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);

  // --- tier catalog writes ---
  rpc CreateTier(CreateTierRequest) returns (CreateTierResponse); // AlreadyExists on name clash
  rpc UpdateTier(UpdateTierRequest) returns (UpdateTierResponse); // full replace of name/color/description
  // DeleteTier fails (FailedPrecondition) for the 'default' tier or a tier still
  // assigned to a tenant.
  rpc DeleteTier(DeleteTierRequest) returns (DeleteTierResponse);

  // --- group catalog writes ---
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  // DeleteGroup removes a group; its tenant assignments cascade away.
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);

  // --- tenant <-> group membership (idempotent) ---
  rpc AddTenantToGroup(AddTenantToGroupRequest) returns (AddTenantToGroupResponse);
  rpc RemoveTenantFromGroup(RemoveTenantFromGroupRequest) returns (RemoveTenantFromGroupResponse);

  // --- tenant tier assignment ---
  rpc SetTenantTier(SetTenantTierRequest) returns (SetTenantTierResponse);
}

message Tier {
  string id = 1;
  string name = 2;
  string color = 3; // optional hex, '' = none
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Group {
  string id = 1;
  string name = 2;
  string color = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Tenant {
  string id = 1;
  string name = 2;
  string slug = 3;
  Tier tier = 4;             // always set (tier is required)
  repeated Group groups = 5; // possibly empty
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message ListTiersRequest {}
message ListTiersResponse {
  repeated Tier tiers = 1;
}

message ListGroupsRequest {}
message ListGroupsResponse {
  repeated Group groups = 1;
}

message GetTenantRequest {
  string tenant_id = 1;
}
message GetTenantResponse {
  Tenant tenant = 1;
}

message ListTenantsRequest {
  string tier_id = 1;   // optional filter; empty = any tier
  string group_id = 2;  // optional filter; empty = any group
  int32 page_size = 3;  // default 100, capped at 500
  int32 offset = 4;     // simple offset paging
}
message ListTenantsResponse {
  repeated Tenant tenants = 1;
  int32 total = 2; // total matches, ignoring page_size/offset
}

// Catalog writes. Create* omit id (server-generated).
message CreateTierRequest {
  string name = 1;
  string color = 2;
  string description = 3;
}
message CreateTierResponse {
  Tier tier = 1;
}
message UpdateTierRequest {
  string id = 1;
  string name = 2;
  string color = 3;
  string description = 4;
}
message UpdateTierResponse {
  Tier tier = 1;
}
message DeleteTierRequest {
  string id = 1;
}
message DeleteTierResponse {}

message CreateGroupRequest {
  string name = 1;
  string color = 2;
  string description = 3;
}
message CreateGroupResponse {
  Group group = 1;
}
message UpdateGroupRequest {
  string id = 1;
  string name = 2;
  string color = 3;
  string description = 4;
}
message UpdateGroupResponse {
  Group group = 1;
}
message DeleteGroupRequest {
  string id = 1;
}
message DeleteGroupResponse {}

// Membership + assignment.
message AddTenantToGroupRequest {
  string tenant_id = 1;
  string group_id = 2;
}
message AddTenantToGroupResponse {}
message RemoveTenantFromGroupRequest {
  string tenant_id = 1;
  string group_id = 2;
}
message RemoveTenantFromGroupResponse {}
message SetTenantTierRequest {
  string tenant_id = 1;
  string tier_id = 2;
}
message SetTenantTierResponse {
  Tenant tenant = 1;
}
