syntax = "proto3";

package secrets.v1;

import "google/protobuf/timestamp.proto";

// SecretsService is the internal, operator-facing surface over Ogen's
// envelope-encrypted `secret` table. It exists so Harbor (Ogen's operations
// dashboard) can list / rotate / clear the third-party API keys WITHOUT
// re-implementing the KEK envelope crypto, the name allowlist, or the
// hot-reload subscription hooks — all of which live behind secrets.Store in
// this repo (src/secrets/store.go).
//
// The service is internal-only, reached over the private network and gated by
// a shared bearer token (see src/grpcserver). Plaintext travels ONE WAY: it is
// accepted on Set and is never returned by any RPC. List / Set expose metadata
// only, mirroring the existing REST handler (src/handlers/secrets.go).
service SecretsService {
  // List returns one entry PER ALLOWLISTED NAME (secrets.AllowedNames),
  // whether or not a value is stored — so the caller renders the full set of
  // known slots without duplicating the allowlist. `set` distinguishes a
  // stored secret (with metadata) from an empty slot.
  rpc List(ListRequest) returns (ListResponse);

  // Set upserts (creates or rotates) the encrypted value for an allowlisted
  // name. The plaintext value is write-only and never echoed back.
  rpc Set(SetRequest) returns (SetResponse);

  // Delete removes a stored secret. Features depending on the deleted key
  // degrade on next use (no restart / no boot failure).
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

// SecretMetadata is the non-sensitive view of one allowlist slot. It never
// carries ciphertext, nonces, wrapped DEKs, or plaintext. When `set` is false
// the slot is empty and the remaining fields are zero-valued.
message SecretMetadata {
  string name = 1;
  bool set = 2; // whether a value is currently stored for this name
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  int32 kek_version = 5;
  string algorithm = 6;
  // decryptable reports whether the loaded KEK can still unwrap this row — a
  // false here surfaces a KEK mismatch to the operator without exposing why.
  bool decryptable = 7;
}

message ListRequest {}

message ListResponse {
  // One entry per allowlisted name, in allowlist order.
  repeated SecretMetadata secrets = 1;
}

message SetRequest {
  string name = 1;
  string value = 2; // plaintext; write-only, never returned
}

message SetResponse {
  SecretMetadata secret = 1;
  bool created = 2; // true = fresh insert, false = rotation of an existing value
}

message DeleteRequest {
  string name = 1;
}

message DeleteResponse {}
