#    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install --frozen-lockfile && pnpm exec vite --host 0.0.0.0"
#    depends_on:
#      - api

  llama-embedserver:
    image: alephbetai/llama-embedserver:latest
    platform: linux/amd64
    ports:
      - "9003:8080"

volumes:
  db-data:
  ogen-keys:
