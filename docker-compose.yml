services:
  api:
    image: serhiiherasymovbndigital/ogen:latest
    platform: linux/amd64
    # Storage credentials (Cloudflare R2) live in .env.storage, which is
    # gitignored. Copy .env.storage.example -> .env.storage to populate it.
    # required: false keeps `up` working when the file is absent (uploads
    # just stay disabled, matching an empty STORAGE_ENDPOINT).
    env_file:
      - path: .env.storage
        required: false
    environment:
      ADDR: ":9001"
      DATABASE_DSN: "file:/data/app.db?cache=shared&_pragma=journal_mode(WAL)"
      EMBED_SERVER_URL: "http://llama-embedserver:8080"
      ANTHROPIC_API_KEY: ""

      # Envelope-encryption KEK directory. Mounted from a named volume
      # so the key survives container rebuilds — losing it bricks every
      # encrypted secret in the database. The actual file is kek.v1
      # under this path.
      OGEN_KEK_PATH: "/var/lib/ogen/keys"
    volumes:
      - ./ogen-data:/data
      - ./ogen-keys:/var/lib/ogen/keys
    ports:
      - "9001:9001"
    depends_on:
      - llama-embedserver

