services:
  api:
    image: serhiiherasymovbndigital/content-control-center:latest
    platform: linux/amd64
    environment:
      ADDR: ":3000"
      DATABASE_DSN: "file:/data/app.db?cache=shared&_pragma=journal_mode(WAL)"
    volumes:
      - ./data:/data
    ports:
      - "3000:3000"

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    environment:
      API_URL: "http://api:3000"
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  db-data:
