services:
  api:
    image: serhiiherasymovbndigital/ogen:latest
    platform: linux/amd64
    # Storage credentials (Cloudflare R2) live in .env.storage, which is
    # gitignored. Copy .env.storage.example -> .env.storage to populate it.
    # required: false keeps `up` working when the file is absent (uploads
    # just stay disabled, matching an empty STORAGE_ENDPOINT).
    env_file:
      - path: .env.storage
        required: false
    environment:
      ADDR: ":9001"
      DATABASE_DSN: "postgres://ogen:ogen@postgres:5432/ogen?sslmode=disable"
      EMBED_SERVER_URL: "http://llama-embedserver:8080"
      ANTHROPIC_API_KEY: ""

      # Envelope-encryption KEK directory. Mounted from a named volume
      # so the key survives container rebuilds — losing it bricks every
      # encrypted secret in the database. The actual file is kek.v1
      # under this path.
      OGEN_KEK_PATH: "/var/lib/ogen/keys"
    volumes:
      - ./ogen-keys:/var/lib/ogen/keys
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
      llama-embedserver:
        condition: service_started

  postgres:
    # pgvector image = stock Postgres 17 + the `vector` extension prebuilt
    # (CON-87 WS4). Multi-arch, so it runs native on arm64/amd64 hosts.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ogen
      POSTGRES_PASSWORD: ogen
      POSTGRES_DB: ogen
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogen -d ogen"]
      interval: 2s
      timeout: 2s
      retries: 30

  # River job-queue dashboard (CON-87 WS3). Standalone UI image that reads
  # River's tables — it runs no migrations of its own, so it needs them to
  # already exist. The API creates them via jobs.MigrateRiver at boot;
  # riverui therefore depends on the API and restarts until the schema is
  # present. UI at http://localhost:9004.
  riverui:
    image: ghcr.io/riverqueue/riverui:latest
    environment:
      DATABASE_URL: "postgres://ogen:ogen@postgres:5432/ogen?sslmode=disable"
    ports:
      - "9004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

